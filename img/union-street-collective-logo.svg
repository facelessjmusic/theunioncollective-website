<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480" role="img" aria-label="The Union Street Collective, Traverse City" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Union Street Collective</title>
  <defs>
    <path id="arc-top" d="M 82 240 A 268 170 0 0 1 618 240"/>
    <path id="arc-bottom" d="M 54 240 A 296 196 0 0 0 646 240"/>
    <path id="horn-body" d="M132 296 C165 236 255 196 372 192 C402 191 420 180 436 158 L470 268 C452 285 420 272 372 268 C270 264 200 286 160 326 Z"/>
    <clipPath id="horn-clip"><use href="#horn-body"/></clipPath>
  </defs>

  <!-- Sign frame -->
  <ellipse cx="350" cy="240" rx="340" ry="230" fill="#c9a24a"/>
  <ellipse cx="350" cy="240" rx="334" ry="224" fill="#16262b"/>
  <ellipse cx="350" cy="240" rx="326" ry="216" fill="none" stroke="#efe4c4" stroke-width="2"/>
  <ellipse cx="350" cy="240" rx="252" ry="152" fill="none" stroke="#c9a24a" stroke-width="1.5"/>

  <!-- Lettering -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#efe4c4" text-anchor="middle">
    <text font-size="44" letter-spacing="5"><textPath href="#arc-top" startOffset="50%">UNION STREET</textPath></text>
    <text font-size="44" letter-spacing="7"><textPath href="#arc-bottom" startOffset="50%">COLLECTIVE</textPath></text>
    <text x="350" y="372" font-size="13" letter-spacing="5" fill="#c9a24a">TRAVERSE CITY</text>
  </g>

  <!-- Side ornaments -->
  <path d="M60 232 L68 240 L60 248 L52 240 Z" fill="#c9a24a"/>
  <path d="M640 232 L648 240 L640 248 L632 240 Z" fill="#c9a24a"/>

  <!-- Horn -->
  <use href="#horn-body" fill="#c9a24a"/>
  <g clip-path="url(#horn-clip)" fill="none">
    <path d="M236 180 L246 300" stroke="#16262b" stroke-width="3" opacity=".55"/>
    <path d="M300 170 L306 290" stroke="#16262b" stroke-width="3" opacity=".55"/>
    <path d="M150 282 C185 232 262 205 372 202" stroke="#efe4c4" stroke-width="4" opacity=".6"/>
  </g>
  <path d="M132 296 L160 326" stroke="#efe4c4" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="453" cy="213" rx="20" ry="58" transform="rotate(-17 453 213)" fill="#0e1a1e" stroke="#efe4c4" stroke-width="4"/>

  <!-- Cherries spilling from the bell -->
  <path d="M486 247 Q492 238 505 232 M516 271 Q514 250 505 232" fill="none" stroke="#5f8a4c" stroke-width="3" stroke-linecap="round"/>
  <path d="M505 232 C512 212 534 210 542 216 C534 232 516 238 505 232 Z" fill="#5f8a4c"/>
  <circle cx="486" cy="262" r="15" fill="#b3272f"/>
  <circle cx="516" cy="286" r="15" fill="#b3272f"/>
  <circle cx="481" cy="257" r="3.5" fill="#efe4c4" opacity=".7"/>
  <circle cx="511" cy="281" r="3.5" fill="#efe4c4" opacity=".7"/>

  <!-- Notes -->
  <g fill="#efe4c4">
    <ellipse cx="502" cy="194" rx="9" ry="6.5" transform="rotate(-20 502 194)"/>
    <ellipse cx="532" cy="186" rx="9" ry="6.5" transform="rotate(-20 532 186)"/>
    <rect x="508" y="154" width="3" height="40"/>
    <rect x="538" y="146" width="3" height="40"/>
    <path d="M508 154 L541 146 L541 153 L508 161 Z"/>
  </g>
</svg>
